<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>賽程表 - 循環賽</title>
  <style>
    :root {
      --bg: #0a0f14;
      --panel: #121a24;
      --panel-2: #1a2533;
      --line: #25ff35;
      --text: #eff5ff;
      --muted: #9aa8bf;
      --chip: #0e1521;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Bahnschrift", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -20%, #192536 0%, transparent 58%),
        repeating-linear-gradient(135deg, #0a0f14 0 16px, #0d141d 16px 32px),
        var(--bg);
      padding: 20px;
    }

    .wrap {
      width: min(1180px, 96vw);
      margin: 0 auto;
      border: 2px solid #263344;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 3.2vw, 46px);
      letter-spacing: 1px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .btn {
      border: 1px solid #41536c;
      background: var(--chip);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .btn.primary {
      border-color: #1f7f2e;
      background: #103018;
      color: #d5ffe0;
    }

    .step {
      margin-bottom: 16px;
      border: 1px solid #2e3f55;
      background: var(--panel);
      border-radius: 10px;
      padding: 12px;
    }

    .step h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type="number"],
    input[type="text"] {
      border: 1px solid #3b4f69;
      background: #0c131d;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    input[type="number"] {
      width: 120px;
    }

    .name-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .rounds {
      display: grid;
      gap: 10px;
    }

    .round {
      border: 1px solid #2f4158;
      border-radius: 10px;
      background: var(--panel-2);
      padding: 10px;
    }

    .round h3 {
      margin: 0 0 8px;
      font-size: 19px;
      color: #d7e3ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0d1520;
    }

    th, td {
      border: 1px solid #29384b;
      padding: 8px;
      text-align: left;
      font-size: 15px;
    }

    th { background: #152131; }

    .badge {
      display: inline-block;
      border: 1px solid #2e8640;
      color: #c9ffd4;
      background: rgba(37,255,53,.08);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 13px;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .edit-btn {
      border: 1px solid #58718f;
      border-radius: 6px;
      background: #162538;
      color: #e4efff;
      padding: 5px 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .hidden { display: none; }

    .standings {
      margin-top: 12px;
      border: 1px solid #2f4158;
      border-radius: 10px;
      background: #111b28;
      padding: 10px;
    }

    .standings h3 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #d7e3ff;
    }

    .phase-title {
      margin: 18px 0 8px;
      font-size: 24px;
      color: #d7e3ff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>賽程表（人數循環賽）</h1>

    <div class="toolbar">
      <button id="backBtn" class="btn">返回記分板</button>
      <button id="clearBtn" class="btn">清空本頁資料</button>
    </div>

    <section class="step" id="step1">
      <h2>步驟 1：輸入人數</h2>
      <div class="row">
        <label for="playerCount">參賽人數</label>
        <input id="playerCount" type="number" min="2" max="64" value="4" />
        <button id="buildNamesBtn" class="btn primary">下一步：輸入名字</button>
      </div>
      <div class="hint">支援 2-64 人。奇數人會自動加入「輪空」。</div>
    </section>

    <section class="step hidden" id="step2">
      <h2>步驟 2：輸入參賽者名字</h2>
      <div id="nameInputs" class="name-grid"></div>
      <div class="row" style="margin-top: 10px;">
        <button id="generateBtn" class="btn primary">產生循環賽賽程圖表</button>
      </div>
    </section>

    <section class="step hidden" id="step3">
      <h2>賽程圖表</h2>
      <div id="meta"></div>
      <div id="rounds" class="rounds"></div>
      <div id="preliminarySummary" class="standings hidden">
        <h3>初賽總結（複賽前）</h3>
        <div id="preliminaryTable"></div>
      </div>
      <h3 id="playoffTitle" class="phase-title hidden">複賽／名次賽</h3>
      <div id="playoffRounds" class="rounds"></div>
      <div id="standings" class="standings hidden">
        <h3>最終積分榜</h3>
        <div id="standingsTable"></div>
      </div>
    </section>
  </div>

  <script>
    const draftKey = "offline-round-robin-v1";
    const tournamentKey = "offline-tournament-v1";

    function saveData(data) {
      localStorage.setItem(draftKey, JSON.stringify(data));
    }

    function loadData() {
      const raw = localStorage.getItem(draftKey);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function isWholeNumber(value) {
      return typeof value === "number" && isFinite(value) && Math.floor(value) === value;
    }

    function saveTournament(data) {
      localStorage.setItem(tournamentKey, JSON.stringify(data));
    }

    function loadTournament() {
      const raw = localStorage.getItem(tournamentKey);
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function createNameInputs(count, names = []) {
      const host = document.getElementById("nameInputs");
      host.innerHTML = "";
      for (let i = 0; i < count; i += 1) {
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = `選手 ${i + 1}`;
        input.value = names[i] || "";
        input.dataset.index = String(i);
        host.appendChild(input);
      }
    }

    function collectNames(count) {
      const inputs = Array.prototype.slice.call(document.querySelectorAll("#nameInputs input"));
      const names = inputs.slice(0, count).map((input, i) => {
        const value = input.value.trim();
        return value || `選手 ${i + 1}`;
      });
      return names;
    }

    function buildRoundRobin(names) {
      const list = names.slice();
      const hasBye = list.length % 2 === 1;
      if (hasBye) list.push("輪空");

      const n = list.length;
      const rounds = [];
      let matchId = 1;
      let arr = list.slice();

      for (let r = 0; r < n - 1; r += 1) {
        const matches = [];
        for (let i = 0; i < n / 2; i += 1) {
          const a = arr[i];
          const b = arr[n - 1 - i];
          if (a !== "輪空" && b !== "輪空") {
            matches.push({ id: `M${matchId++}`, round: r + 1, table: matches.length + 1, a, b });
          }
        }
        rounds.push({ round: r + 1, matches });

        const fixed = arr[0];
        const moving = arr.slice(1);
        moving.unshift(moving.pop());
        arr = [fixed].concat(moving);
      }

      return { rounds, hasBye };
    }

    function getFlatMatches(rounds) {
      const flat = [];
      rounds.forEach((round) => (round.matches || []).forEach((m) => flat.push(m)));
      return flat;
    }

    function getLeagueStandings(players, results) {
      const map = {};
      players.forEach((p) => {
        map[p] = { player: p, points: 0, totalScore: 0, againstScore: 0 };
      });

      Object.keys(results || {}).forEach((key) => {
        const res = results[key];
        if (res.phase === "playoff") return;
        const a = map[res.a];
        const b = map[res.b];
        if (!a || !b) return;

        const as = Number(res.leftScore) || 0;
        const bs = Number(res.rightScore) || 0;
        a.totalScore += as;
        b.totalScore += bs;
        a.againstScore += bs;
        b.againstScore += as;
        if (as > bs) a.points += 3;
        else if (bs > as) b.points += 3;
        else {
          a.points += 1;
          b.points += 1;
        }
      });

      const rows = Object.keys(map).map((key) => map[key]);
      rows.sort((x, y) =>
        y.points - x.points ||
        (y.totalScore - y.againstScore) - (x.totalScore - x.againstScore) ||
        y.totalScore - x.totalScore ||
        x.player.localeCompare(y.player, "zh-Hant")
      );
      return rows;
    }

    function createTieBreakMatches(tournamentState) {
      if (!tournamentState || tournamentState.playoffsInitialized) return;

      const allMatches = getFlatMatches(tournamentState.rounds);
      const leagueMatches = allMatches.filter((match) => match.phase !== "playoff");
      const results = tournamentState.results || {};
      const leagueFinished = leagueMatches.length > 0 && leagueMatches.every((match) => !!results[match.id]);
      if (!leagueFinished) return;

      const standings = getLeagueStandings(tournamentState.players, results);
      const groups = [];
      let start = 0;
      while (start < standings.length) {
        let end = start + 1;
        while (end < standings.length && standings[end].points === standings[start].points) end += 1;
        if (end - start >= 2) groups.push({ start, players: standings.slice(start, end) });
        start = end;
      }

      groups.sort((a, b) => b.start - a.start);
      let playoffId = 1;
      groups.forEach((group) => {
        const players = group.players.map((player) => player.player);
        const groupId = `G${group.start + 1}-${group.start + players.length}`;
        const matches = [];
        let table = 1;
        for (let i = 0; i < players.length; i += 1) {
          for (let j = i + 1; j < players.length; j += 1) {
            matches.push({
              id: `P${playoffId++}`,
              round: `${group.start + 1}-${group.start + players.length}`,
              table: table++,
              a: players[i],
              b: players[j],
              phase: "playoff",
              tieGroupId: groupId,
              tieGroupStart: group.start,
              tieGroupPlayers: players,
            });
          }
        }
        if (matches.length > 0) {
          tournamentState.rounds.push({
            round: `${group.start + 1}-${group.start + players.length}`,
            phase: "playoff",
            tieGroupId: groupId,
            matches,
          });
        }
      });

      tournamentState.playoffsInitialized = true;
      tournamentState.placements = tournamentState.placements || {};
      saveTournament(tournamentState);
    }

    function finalizeTieBreakGroup(tournamentState, match) {
      if (!tournamentState || !match || !match.tieGroupId) return;
      const allMatches = getFlatMatches(tournamentState.rounds);
      const groupMatches = allMatches.filter((item) => item.tieGroupId === match.tieGroupId);
      const results = tournamentState.results || {};
      if (!groupMatches.every((item) => !!results[item.id])) return;

      const map = {};
      (match.tieGroupPlayers || []).forEach((player) => {
        map[player] = { player, points: 0, totalScore: 0, againstScore: 0 };
      });
      groupMatches.forEach((item) => {
        const result = results[item.id];
        const a = map[item.a];
        const b = map[item.b];
        if (!a || !b) return;
        const as = Number(result.leftScore) || 0;
        const bs = Number(result.rightScore) || 0;
        a.totalScore += as;
        b.totalScore += bs;
        a.againstScore += bs;
        b.againstScore += as;
        if (as > bs) a.points += 3;
        else if (bs > as) b.points += 3;
        else {
          a.points += 1;
          b.points += 1;
        }
      });

      const rows = Object.keys(map).map((key) => map[key]);
      rows.sort((x, y) =>
        y.points - x.points ||
        (y.totalScore - y.againstScore) - (x.totalScore - x.againstScore) ||
        y.totalScore - x.totalScore ||
        x.player.localeCompare(y.player, "zh-Hant")
      );
      tournamentState.placements = tournamentState.placements || {};
      let lastKey = "";
      let lastPlace = 0;
      rows.forEach((row, index) => {
        const key = `${row.points}/${row.totalScore - row.againstScore}/${row.totalScore}`;
        const place = index === 0 || key !== lastKey ? match.tieGroupStart + index + 1 : lastPlace;
        tournamentState.placements[row.player] = place;
        lastKey = key;
        lastPlace = place;
      });
      saveTournament(tournamentState);
    }

    function computeStandings(players, results, placements) {
      const map = {};
      players.forEach((p) => {
        map[p] = {
          player: p,
          played: 0,
          win: 0,
          draw: 0,
          lose: 0,
          points: 0,
          totalScore: 0,
          againstScore: 0,
        };
      });

      Object.keys(results || {}).forEach((key) => {
        const res = results[key];
        if (res.phase === "playoff") return;
        const a = map[res.a];
        const b = map[res.b];
        if (!a || !b) return;

        const as = Number(res.leftScore) || 0;
        const bs = Number(res.rightScore) || 0;

        a.played += 1;
        b.played += 1;
        a.totalScore += as;
        b.totalScore += bs;
        a.againstScore += bs;
        b.againstScore += as;

        if (as > bs) {
          a.win += 1;
          b.lose += 1;
          a.points += 3;
        } else if (bs > as) {
          b.win += 1;
          a.lose += 1;
          b.points += 3;
        } else {
          a.draw += 1;
          b.draw += 1;
          a.points += 1;
          b.points += 1;
        }
      });

      const rows = Object.keys(map).map((key) => {
        const r = map[key];
        const row = Object.assign({}, r);
        row.diff = r.totalScore - r.againstScore;
        row.placement = placements && placements[r.player] ? placements[r.player] : null;
        return row;
      });

      rows.sort((x, y) =>
        y.points - x.points ||
        y.diff - x.diff ||
        y.totalScore - x.totalScore ||
        x.player.localeCompare(y.player, "zh-Hant")
      );

      rows.forEach((row, index) => { row.baseRank = index + 1; });
      rows.sort((x, y) =>
        (x.placement || x.baseRank) - (y.placement || y.baseRank) ||
        x.baseRank - y.baseRank
      );

      return rows;
    }

    function buildStandingsTable(rows) {
      const table = document.createElement("table");
      table.innerHTML = `
        <thead>
          <tr>
            <th>排名</th>
            <th>選手</th>
            <th>積分</th>
            <th>總分</th>
            <th>失分</th>
            <th>分差</th>
            <th>勝/和/敗</th>
          </tr>
        </thead>
      `;
      const tbody = document.createElement("tbody");
      let lastPoints = null;
      let lastRank = 0;
      rows.forEach((r, idx) => {
        const rank = r.placement || ((idx === 0 || r.points !== lastPoints) ? (r.baseRank || idx + 1) : lastRank);
        lastPoints = r.points;
        lastRank = rank;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${rank}</td><td>${r.player}</td><td>${r.points}</td><td>${r.totalScore}</td><td>${r.againstScore}</td><td>${r.diff}</td><td>${r.win}/${r.draw}/${r.lose}</td>`;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    function renderStandings(players, tournamentState, allDone) {
      const host = document.getElementById("standings");
      const tableHost = document.getElementById("standingsTable");
      if (!allDone) {
        host.classList.add("hidden");
        tableHost.innerHTML = "";
        return;
      }

      const rows = computeStandings(
        players,
        tournamentState && tournamentState.results ? tournamentState.results : {},
        tournamentState ? tournamentState.placements : null
      );
      tableHost.innerHTML = "";
      tableHost.appendChild(buildStandingsTable(rows));
      host.classList.remove("hidden");
    }

    function renderPreliminaryStandings(players, tournamentState, leagueFinished) {
      const host = document.getElementById("preliminarySummary");
      const tableHost = document.getElementById("preliminaryTable");
      if (!leagueFinished) {
        host.classList.add("hidden");
        tableHost.innerHTML = "";
        return;
      }

      const rows = computeStandings(
        players,
        tournamentState && tournamentState.results ? tournamentState.results : {},
        null
      );
      tableHost.innerHTML = "";
      tableHost.appendChild(buildStandingsTable(rows));
      host.classList.remove("hidden");
    }

    function renderSchedule(names, schedule, tournamentState = null) {
      if (tournamentState) {
        createTieBreakMatches(tournamentState);
        schedule.rounds = tournamentState.rounds;
      }
      const meta = document.getElementById("meta");
      const roundsEl = document.getElementById("rounds");
      const playoffRoundsEl = document.getElementById("playoffRounds");
      const playoffTitle = document.getElementById("playoffTitle");
      roundsEl.innerHTML = "";
      playoffRoundsEl.innerHTML = "";
      const flat = getFlatMatches(schedule.rounds);
      const leagueRounds = schedule.rounds.filter((round) => round.phase !== "playoff");
      const playoffRounds = schedule.rounds.filter((round) => round.phase === "playoff");
      const leagueMatches = getFlatMatches(leagueRounds);
      const indexById = {};
      flat.forEach((m, idx) => { indexById[m.id] = idx; });
      const currentIndex = tournamentState && tournamentState.currentMatchIndex ? Number(tournamentState.currentMatchIndex) : 0;
      const results = tournamentState && tournamentState.results ? tournamentState.results : {};
      const leagueFinished = leagueMatches.length > 0 && leagueMatches.every((match) => !!results[match.id]);
      const allDone = flat.length > 0 && currentIndex >= flat.length;

      meta.innerHTML = [
        `<span class="badge">參賽人數：${names.length}</span>`,
        `<span class="badge">總輪數：${schedule.rounds.length}</span>`,
        `<span class="badge">總場次：${flat.length}</span>`,
        `<span class="badge">目前場次：${Math.min(currentIndex + 1, Math.max(flat.length, 1))}/${Math.max(flat.length, 1)}</span>`,
        schedule.hasBye ? '<span class="badge">含輪空機制</span>' : ""
      ].join(" ");

      function renderRound(round, host) {
        const box = document.createElement("article");
        box.className = "round";

        const title = document.createElement("h3");
        title.textContent = `第 ${round.round} 輪`;
        box.appendChild(title);

        const table = document.createElement("table");
        table.innerHTML = "<thead><tr><th>場次</th><th>選手 A</th><th>選手 B</th><th>狀態</th><th>結果</th><th>操作</th></tr></thead>";

        const tbody = document.createElement("tbody");
        round.matches.forEach((m) => {
          const res = results[m.id];
          const idx = indexById[m.id];
          const status = res ? "完成" : (idx === currentIndex ? "進行中" : "待賽");
          const resultText = res ? `${res.leftScore} : ${res.rightScore}（${res.winner}）` : "-";
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${m.table}</td><td>${m.a}</td><td>${m.b}</td><td>${status}</td><td>${resultText}</td><td></td>`;

          if (res && tournamentState) {
            const editButton = document.createElement("button");
            editButton.type = "button";
            editButton.className = "edit-btn";
            editButton.textContent = "修改";
            editButton.addEventListener("click", () => {
              const leftInput = prompt(`${m.a} 的分數`, String(res.leftScore));
              if (leftInput === null) return;
              const rightInput = prompt(`${m.b} 的分數`, String(res.rightScore));
              if (rightInput === null) return;

              const leftScore = Number(leftInput);
              const rightScore = Number(rightInput);
              if (!isWholeNumber(leftScore) || !isWholeNumber(rightScore) || leftScore < 0 || rightScore < 0) {
                alert("分數必須是 0 或以上的整數。");
                return;
              }

              res.leftScore = leftScore;
              res.rightScore = rightScore;
              res.winner = leftScore > rightScore ? m.a : rightScore > leftScore ? m.b : "平手";
              if (m.phase === "playoff" && m.tieGroupId) {
                res.phase = "playoff";
                res.tieGroupId = m.tieGroupId;
                res.tieGroupPlayers = m.tieGroupPlayers || null;
                finalizeTieBreakGroup(tournamentState, m);
              } else if (res.phase === "playoff" && res.placement) {
                tournamentState.placements = tournamentState.placements || {};
                if (leftScore !== rightScore) {
                  const winner = leftScore > rightScore ? m.a : m.b;
                  const loser = leftScore > rightScore ? m.b : m.a;
                  tournamentState.placements[winner] = res.placement[0];
                  tournamentState.placements[loser] = res.placement[1];
                } else {
                  delete tournamentState.placements[m.a];
                  delete tournamentState.placements[m.b];
                }
              }
              saveTournament(tournamentState);
              renderSchedule(names, schedule, tournamentState);
            });
            tr.lastElementChild.appendChild(editButton);
          }
          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        box.appendChild(table);
        host.appendChild(box);
      }

      leagueRounds.forEach((round) => renderRound(round, roundsEl));
      renderPreliminaryStandings(names, tournamentState, leagueFinished);

      if (playoffRounds.length > 0) {
        playoffTitle.classList.remove("hidden");
        playoffRounds.forEach((round) => renderRound(round, playoffRoundsEl));
      } else {
        playoffTitle.classList.add("hidden");
      }

      renderStandings(names, tournamentState, allDone);
    }

    function showStep(step2 = false, step3 = false) {
      document.getElementById("step2").classList.toggle("hidden", !step2);
      document.getElementById("step3").classList.toggle("hidden", !step3);
    }

    document.getElementById("buildNamesBtn").addEventListener("click", () => {
      const count = Number(document.getElementById("playerCount").value);
      if (!isWholeNumber(count) || count < 2 || count > 64) {
        alert("請輸入 2 到 64 之間的人數。");
        return;
      }

      createNameInputs(count);
      showStep(true, false);

      saveData({ count, names: [] });
    });

    document.getElementById("generateBtn").addEventListener("click", () => {
      const count = Number(document.getElementById("playerCount").value);
      const names = collectNames(count);
      const schedule = buildRoundRobin(names);
      const tournament = {
        createdAt: new Date().toISOString(),
        players: names,
        rounds: schedule.rounds,
        currentMatchIndex: 0,
        results: {},
      };
      saveTournament(tournament);
      renderSchedule(names, schedule, tournament);
      showStep(true, true);
      saveData({ count, names });
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      if (window.location.protocol.startsWith("http")) {
        const baseDir = window.location.pathname.replace(/\/[^/]*$/, "/");
        window.location.href = `${window.location.origin}${baseDir}index.html`;
      } else {
        window.location.href = "./beyx_offline_scoreboard.html";
      }
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      localStorage.removeItem(draftKey);
      localStorage.removeItem(tournamentKey);
      document.getElementById("playerCount").value = "4";
      document.getElementById("nameInputs").innerHTML = "";
      document.getElementById("meta").innerHTML = "";
      document.getElementById("rounds").innerHTML = "";
      showStep(false, false);
    });

    const saved = loadData();
    if (saved && isWholeNumber(saved.count) && saved.count >= 2 && saved.count <= 64) {
      document.getElementById("playerCount").value = String(saved.count);
      createNameInputs(saved.count, saved.names || []);
      showStep(true, false);
    }

    const tournament = loadTournament();
    if (tournament && Array.isArray(tournament.players) && Array.isArray(tournament.rounds)) {
      const names = tournament.players;
      document.getElementById("playerCount").value = String(names.length);
      createNameInputs(names.length, names);
      const hasBye = names.length % 2 === 1;
      renderSchedule(names, { rounds: tournament.rounds, hasBye }, tournament);
      showStep(true, true);
    }

    window.addEventListener("storage", (event) => {
      if (event.key !== tournamentKey) return;
      const latest = loadTournament();
      if (!latest || !Array.isArray(latest.players) || !Array.isArray(latest.rounds)) return;
      const names = latest.players;
      document.getElementById("playerCount").value = String(names.length);
      createNameInputs(names.length, names);
      renderSchedule(names, { rounds: latest.rounds, hasBye: names.length % 2 === 1 }, latest);
      showStep(true, true);
    });
  </script>
</body>
</html>
